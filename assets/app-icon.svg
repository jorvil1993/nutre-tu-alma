<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nutre tu Alma - Llama de fuego interior con cruz sagrada">
  <defs>
    <!-- Fondo con gradiente sutil -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b1e17"/>
      <stop offset="100%" stop-color="#0c0d0a"/>
    </radialGradient>

    <!-- Resplandor exterior de la llama -->
    <radialGradient id="glowGrad" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#e8b958" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c6923b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c6923b" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente dorado de la llama exterior -->
    <linearGradient id="flameOuterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b87b22"/>
      <stop offset="35%" stop-color="#dca53e"/>
      <stop offset="70%" stop-color="#f5d378"/>
      <stop offset="100%" stop-color="#fff2c2"/>
    </linearGradient>

    <!-- Gradiente de la llama interior viva -->
    <linearGradient id="flameInnerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d6962f"/>
      <stop offset="50%" stop-color="#f7dc8a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Gradiente del halo sacro -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d378" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b87b22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f5d378" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Sombra suave para dar volumen -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base redondeada del ícono -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#2b2d24" stroke-width="2"/>

  <!-- Halo de resplandor difuso -->
  <circle cx="256" cy="285" r="160" fill="url(#glowGrad)"/>

  <!-- Halo geométrico sacro circular -->
  <circle cx="256" cy="270" r="172" fill="none" stroke="url(#haloGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="256" cy="270" r="184" fill="none" stroke="url(#haloGrad)" stroke-width="1" opacity="0.35"/>

  <!-- Destello / Estrella superior de 4 puntas -->
  <g transform="translate(256, 76)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#ffeec2" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Pequeños destellos ascendentes -->
  <circle cx="190" cy="180" r="2.5" fill="#f5d378" opacity="0.6"/>
  <circle cx="320" cy="165" r="3" fill="#f5d378" opacity="0.7"/>
  <circle cx="335" cy="225" r="2" fill="#f5d378" opacity="0.5"/>

  <!-- Llama principal de oración -->
  <g filter="url(#softGlow)">
    <path d="M 256,108 
             C 292,175 362,242 362,316 
             C 362,376 316,412 256,412 
             C 196,412 150,376 150,316 
             C 150,242 220,175 256,108 Z" 
          fill="url(#flameOuterGrad)"/>
  </g>

  <!-- Núcleo de luz interior de la llama -->
  <path d="M 256,162 
           C 278,210 322,258 322,312 
           C 322,354 292,382 256,382 
           C 220,382 190,354 190,312 
           C 190,258 234,210 256,162 Z" 
        fill="url(#flameInnerGrad)" opacity="0.95"/>

  <!-- Cruz en negativo / sagrario en el corazón de la llama -->
  <g fill="#11130f">
    <!-- Eje vertical de la cruz -->
    <rect x="248" y="222" width="16" height="136" rx="8"/>
    <!-- Eje horizontal de la cruz -->
    <rect x="214" y="258" width="84" height="16" rx="8"/>
  </g>

  <!-- Pequeño punto de luz en la intersección de la cruz -->
  <circle cx="256" cy="266" r="3" fill="#f5d378" opacity="0.65"/>
</svg>
